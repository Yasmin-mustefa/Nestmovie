<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Nestmovie account.">
  <title>Login — Nestmovie</title>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="../index.html">Nestmovie</a>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="search.html">Search</a></li>
        <li><a href="watchlist.html">My Watchlist</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="login-heading">
      <h1 id="login-heading">Welcome back</h1>
      <p>Sign in to continue discovering movies.</p>

      <form action="#" method="post">
        <div>
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit">Log in</button>
      </form>

      <p><a href="discover.html">Continue browsing movies</a></p>
    </section>
  </main>

  <footer>
    <p>Nestmovie — find your next watch.</p>
  </footer>
</body>
</html>
