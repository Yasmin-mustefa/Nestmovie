<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Nestmovie account.">
  <title>Create Account — Nestmovie</title>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="../index.html">Nestmovie</a>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="search.html">Search</a></li>
        <li><a href="watchlist.html">My Watchlist</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="register-heading">
      <h1 id="register-heading">Create your account</h1>
      <p>Join Nestmovie to keep track of the movies you love.</p>

      <form action="#" method="post">
        <div>
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            required
          >
        </div>

        <div>
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <div>
          <label for="confirm-password">Confirm password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button type="submit">Create account</button>
      </form>

      <p>Already have an account? <a href="login.html">Log in</a></p>
      <p><a href="discover.html">Continue browsing movies</a></p>
    </section>
  </main>

  <footer>
    <p>Nestmovie — find your next watch.</p>
  </footer>
</body>
</html>
